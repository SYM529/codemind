name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server_py/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: server_py
        run: pip install -r requirements-dev.txt

      - name: Compile check
        working-directory: server_py
        run: python -m compileall -q .

      - name: Run tests
        working-directory: server_py
        env:
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-hs256
        run: python -m pytest -q

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build
